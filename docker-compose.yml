services:
  angular-client:
    build:
      context: ./apps/angular-client
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
    ports:
      - "${ANGULAR_CLIENT_PORT:-4000}:4000"

  web-api:
    build:
      context: ./apps/web-api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      EnableHttpsRedirection: "false"
      # The API refuses to start with the placeholder key that ships in
      # appsettings.json. Supply a real one through the environment; never
      # commit the value itself.
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in your .env - see .env.example}
      # The allowed-origin list only binds from indexed variables, so the
      # entries are numbered rather than comma separated.
      Cors__AllowedOrigins__0: ${API_ALLOWED_ORIGIN_0:-http://localhost:4000}
      Cors__AllowedOrigins__1: ${API_ALLOWED_ORIGIN_1:-http://localhost:8080}
      # Serve the Swagger UI. It is off by default outside Development.
      EnableSwagger: ${ENABLE_SWAGGER:-true}
    ports:
      - "${WEB_API_PORT:-8081}:8080"

  mvc-web:
    build:
      context: ./apps/mvc-web
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      MoviesApi__BaseUrl: ${MOVIES_API_BASE_URL:-http://web-api:8080/api/v1}
    ports:
      - "${MVC_WEB_PORT:-8080}:8080"
    depends_on:
      web-api:
        condition: service_healthy
